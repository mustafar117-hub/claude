<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ops Ledger</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#2B3A5C;
    --paper:#FBFBF9;
    --panel:#FFFFFF;
    --line:#E4E2DD;
    --line-strong:#CFCBC0;
    --slate:#5B6472;
    --emerald:#146356;
    --emerald-bg:#E9F3F0;
    --rust:#9C3D22;
    --rust-bg:#F7EBE6;
    --amber:#8A6A12;
    --amber-bg:#FBF3DE;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---- Auth screen ---- */
  .gate{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .gate-card{
    max-width:420px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:3px solid var(--ink);
    padding:36px 32px;
  }
  .gate-card h1{
    font-family:'Fraunces',serif;
    font-size:26px;
    margin:0 0 6px;
  }
  .gate-card p.sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 24px;
  }
  .gate-error{
    background:var(--rust-bg); color:var(--rust); font-size:13px;
    padding:10px 12px; border-radius:var(--radius); margin-bottom:16px; line-height:1.5;
  }
  .gate-note{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--slate);
    margin-top:18px; line-height:1.6;
  }
  .gate-link{ cursor:pointer; text-decoration:underline; color:var(--emerald); }

  /* ---- Sidebar ---- */
  .rail{
    width:210px; flex-shrink:0;
    background:var(--ink); color:#EDEFF5;
    display:flex; flex-direction:column;
    padding:28px 0 20px;
  }
  .brand{
    padding:0 22px 22px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:6px;
  }
  .brand-row{ display:flex; align-items:center; gap:11px; }
  .brand-logo{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:#fff; object-fit:cover; padding:2px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.12);
  }
  .brand-name{
    font-family:'Fraunces',serif; font-size:18px; font-weight:600;
    letter-spacing:0.2px; line-height:1.25;
  }
  .brand small{
    display:block; font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:400; letter-spacing:1.5px;
    text-transform:uppercase; color:#9AA5C4; margin-top:4px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 22px; font-size:14px; font-weight:500;
    color:#C7CCDE; cursor:pointer;
    border-left:3px solid transparent;
    transition:background 0.15s, color 0.15s;
    user-select:none;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:#fff; }
  .nav-item.active{
    background:rgba(255,255,255,0.08);
    border-left-color:var(--emerald); color:#fff;
  }
  .nav-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7883A6; width:16px; }
  .rail-foot{
    margin-top:auto; padding:14px 22px 0;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#6E7896;
    border-top:1px solid rgba(255,255,255,0.1); padding-top:14px;
  }
  .rail-foot a{ color:#9AA5C4; cursor:pointer; text-decoration:underline; }

  /* ---- Main ---- */
  .main{ flex:1; padding:40px 48px 60px; max-width:980px; }
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:26px; padding-bottom:18px; border-bottom:2px solid var(--ink);
  }
  .page-head h1{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin:0; }
  .page-head .sub{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--slate);
    text-transform:uppercase; letter-spacing:1px; margin-top:4px;
  }
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    background:var(--ink); color:#fff; border:none;
    padding:10px 18px; border-radius:var(--radius); cursor:pointer;
    transition:background 0.15s;
  }
  .btn:hover{ background:var(--ink-soft); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); }
  .btn.ghost:hover{ border-color:var(--ink); }
  .btn.small{ padding:6px 12px; font-size:12.5px; }
  .btn.full{ width:100%; }

  .stat-row{ display:flex; gap:16px; margin-bottom:32px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:180px; background:var(--panel);
    border:1px solid var(--line); border-top:3px solid var(--ink); padding:16px 18px;
  }
  .stat .label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:1px; color:var(--slate);
  }
  .stat .value{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px; }
  .stat.credit{ border-top-color:var(--emerald); }
  .stat.debit{ border-top-color:var(--rust); }

  .section-title{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:30px 0 10px; }

  .sheet{ background:var(--panel); border:1px solid var(--line); }
  .row{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row:nth-child(even){ background:#FAFAF8; }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-weight:600; font-size:14.5px; }
  .row-meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--slate); margin-top:3px; }
  .amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; white-space:nowrap; }
  .amount.credit{ color:var(--emerald); }
  .amount.debit{ color:var(--rust); }
  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.6px; padding:3px 8px; border-radius:2px; white-space:nowrap;
  }
  .badge.todo{ background:var(--amber-bg); color:var(--amber); }
  .badge.progress{ background:#E6EEF7; color:#2C5C8A; }
  .badge.done{ background:var(--emerald-bg); color:var(--emerald); }
  .badge.credit{ background:var(--emerald-bg); color:var(--emerald); }
  .badge.debit{ background:var(--rust-bg); color:var(--rust); }
  .badge.priority-high{ background:var(--rust-bg); color:var(--rust); }
  .badge.priority-normal{ background:var(--amber-bg); color:var(--amber); }
  .badge.priority-low{ background:var(--emerald-bg); color:var(--emerald); }
  .row.urgent{ border-left:3px solid var(--rust); }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--slate); font-size:16px; padding:4px 8px; }
  .icon-btn:hover{ color:var(--rust); }

  .task-check{
    flex-shrink:0; width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--line-strong); background:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; line-height:1;
    transition:background 0.15s, border-color 0.15s;
  }
  .task-check:hover{ border-color:var(--emerald); }
  .task-check.checked{ background:var(--emerald); border-color:var(--emerald); }
  .row-title.done{ text-decoration:line-through; color:var(--slate); font-weight:500; }
  .filter-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .filter-tab{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase;
    letter-spacing:0.6px; padding:6px 12px; border:1px solid var(--line-strong);
    background:#fff; color:var(--slate); cursor:pointer; border-radius:2px;
  }
  .filter-tab.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .empty{ padding:40px 20px; text-align:center; color:var(--slate); font-family:'IBM Plex Mono',monospace; font-size:12.5px; }

  .form-panel{ background:var(--panel); border:1px solid var(--line-strong); padding:20px; margin-bottom:24px; display:none; }
  .form-panel.open{ display:block; }
  .convo-log{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .convo-log-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.8px; color:var(--slate); margin-bottom:5px;
  }
  .convo-entry{ font-size:13px; line-height:1.5; margin-bottom:4px; position:relative; padding-right:22px; }
  .convo-entry.empty-note{ color:var(--slate); font-style:italic; }
  .convo-entry .icon-btn{ position:absolute; right:-4px; top:-3px; font-size:12px; padding:2px 4px; }
  .convo-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate); margin-right:8px; }
  .convo-toggle{
    background:none; border:none; color:var(--emerald); cursor:pointer; padding:2px 0;
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-decoration:underline;
  }
  .row-actions{ display:flex; flex-direction:column; gap:6px; align-items:stretch; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .form-grid.single{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full{ grid-column:1 / -1; }
  .field label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.8px; color:var(--slate);
  }
  .field input, .field select, .field textarea{
    font-family:'Inter',sans-serif; font-size:14px; padding:9px 10px;
    border:1px solid var(--line-strong); border-radius:var(--radius); background:#fff; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .form-actions{ display:flex; gap:10px; }

  .setup-block{
    background:var(--panel); border:1px solid var(--line-strong); padding:28px;
    max-width:560px; margin:60px auto; text-align:left;
  }
  .setup-block h1{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 12px; }
  .setup-block p{ font-size:14px; line-height:1.6; color:var(--ink-soft); }
  .setup-block code{
    display:block; background:var(--paper); border:1px solid var(--line); padding:10px 12px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; margin:10px 0; overflow-x:auto;
  }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .rail{ width:100%; flex-direction:row; overflow-x:auto; padding:14px 10px; }
    .brand{ display:none; }
    .nav-item{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .nav-item.active{ border-bottom-color:var(--emerald); }
    .rail-foot{ display:none; }
    .main{ padding:24px 18px 40px; }
    .form-grid{ grid-template-columns:1fr; }
    .page-head{ flex-direction:column; align-items:flex-start; gap:10px; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
// Fill these in from your Supabase project: Settings → API.
const SUPABASE_URL = 'https://bwczyogrpcnbeuxerojh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3Y3p5b2dycGNuYmV1eGVyb2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjI5MjMsImV4cCI6MjEwMzU5ODkyM30.rJdGYScA475CoDD-dEqfOZMfNvl54szzcn_I8f7mpSk';

const sb = (SUPABASE_URL.startsWith('http') && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let session = null;
let profile = null; // { id, name, role }
let authMode = 'login'; // 'login' | 'signup'
let authError = null;
let authBusy = false;

let data = { company:'My Company', tasks:[], profiles:[], customers:[], vendors:[], appointments:[], ledger:[] };

let view = 'dashboard';
let openForm = null;
let taskFilter = 'open';
let ledgerPartyFilter = '';
let ledgerMonthFilter = '';
let expandedLogs = new Set();
window._noteFor = null;
window._apptCustomerId = null;

const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => {
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
};
const fmtMoney = (n) => {
  const v = Number(n)||0;
  return (v<0?'-':'') + '$' + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
};
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function profileName(id){
  const p = data.profiles.find(x=>x.id===id);
  return p ? p.name : null;
}
function customerName(id){
  const c = data.customers.find(x=>x.id===id);
  return c ? c.name : '—';
}
function vendorName(id){
  const v = data.vendors.find(x=>x.id===id);
  return v ? v.name : '—';
}
function partyName(type, id){
  if(type==='vendor') return vendorName(id);
  if(type==='customer') return customerName(id);
  return null;
}
function allNotesSorted(){
  const all = [];
  data.customers.forEach(c=> (c.notes||[]).forEach(n=> all.push({...n, partyName:c.name})));
  data.vendors.forEach(v=> (v.notes||[]).forEach(n=> all.push({...n, partyName:v.name})));
  return all.sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
}
function renderConvoEntries(notes, expanded, kind, id){
  if(!notes.length) return `<div class="convo-entry empty-note">No updates logged yet.</div>`;
  const entry = n => `<div class="convo-entry"><span class="convo-date">${fmtDate(n.date)}</span>${escapeHtml(n.text)}<button class="icon-btn del-note" data-kind="${kind}" data-id="${id}" data-note-id="${n.id}" title="Delete">✕</button></div>`;
  if(!expanded){
    const extra = notes.length>1 ? `<button class="convo-toggle" data-kind="${kind}" data-id="${id}">+ ${notes.length-1} earlier</button>` : '';
    return entry(notes[0]) + extra;
  }
  return notes.map(entry).join('') + `<button class="convo-toggle" data-kind="${kind}" data-id="${id}">Show less</button>`;
}
function statusClass(s){
  if(s==='done') return 'done';
  if(s==='in progress') return 'progress';
  return 'todo';
}
function priorityBadge(p){
  const map = { high: {cls:'priority-high', label:'Urgent'}, normal: {cls:'priority-normal', label:'Medium'}, low: {cls:'priority-low', label:'Low'} };
  const m = map[p] || map.normal;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

// ---------- DB row <-> app-shape mapping ----------
function fromDbTask(r){ return { id:r.id, title:r.title, assigneeId:r.assignee_id, due:r.due, priority:r.priority, status:r.status, completedAt:r.completed_at }; }
function fromDbCustomer(r){ return { id:r.id, name:r.name, phone:r.phone, email:r.email, notes:[] }; }
function fromDbVendor(r){ return { id:r.id, name:r.name, phone:r.phone, email:r.email, notes:[] }; }
function fromDbAppt(r){ return { id:r.id, customerId:r.customer_id, date:r.date, time:r.time, service:r.service, notes:r.notes }; }
function fromDbLedger(r){ return { id:r.id, description:r.description, date:r.date, type:r.type, amount:Number(r.amount), partyType:r.party_type, partyId:r.party_id }; }
function fromDbNote(r){ return { id:r.id, partyType:r.party_type, partyId:r.party_id, date:r.date, text:r.text }; }

async function loadAll(){
  const [{data:tasks}, {data:profiles}, {data:settings}] = await Promise.all([
    sb.from('tasks').select('*').order('created_at'),
    sb.from('profiles').select('*').order('name'),
    sb.from('settings').select('*').maybeSingle()
  ]);
  data.tasks = (tasks||[]).map(fromDbTask);
  data.profiles = profiles || [];
  data.company = (settings && settings.company) || 'My Company';

  if(profile.role==='owner'){
    const [{data:customers},{data:vendors},{data:appts},{data:ledger},{data:notes}] = await Promise.all([
      sb.from('customers').select('*').order('name'),
      sb.from('vendors').select('*').order('name'),
      sb.from('appointments').select('*').order('date'),
      sb.from('ledger').select('*').order('date',{ascending:false}),
      sb.from('party_notes').select('*').order('date',{ascending:false})
    ]);
    data.customers = (customers||[]).map(fromDbCustomer);
    data.vendors = (vendors||[]).map(fromDbVendor);
    data.appointments = (appts||[]).map(fromDbAppt);
    data.ledger = (ledger||[]).map(fromDbLedger);
    const notesList = (notes||[]).map(fromDbNote);
    data.customers.forEach(c=> c.notes = notesList.filter(n=>n.partyType==='customer' && n.partyId===c.id));
    data.vendors.forEach(v=> v.notes = notesList.filter(n=>n.partyType==='vendor' && n.partyId===v.id));
  } else {
    data.customers = []; data.vendors = []; data.appointments = []; data.ledger = [];
  }
}

async function afterLogin(){
  const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = p || null;
  if(profile) await loadAll();
  render();
}

async function boot(){
  if(!sb){ render(); return; }
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  if(session){ await afterLogin(); }
  else { render(); }
}

// ---------- ROOT RENDER ----------
function render(){
  const root = document.getElementById('root');
  if(!sb){ root.innerHTML = renderSetupNotice(); return; }
  if(!session){ root.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  if(!profile){ root.innerHTML = renderNoProfile(); attachNoProfileHandlers(); return; }
  root.innerHTML = renderApp();
  attachHandlers();
}

function renderSetupNotice(){
  return `
  <div class="setup-block">
    <h1>Ops Ledger — one-time setup needed</h1>
    <p>This page isn't connected to a database yet. Create a free Supabase project, run <code>supabase/schema.sql</code> from the repo in its SQL editor, then paste your Project URL and anon key into the <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> constants near the top of this file.</p>
    <code>Settings → API → Project URL, anon public key</code>
  </div>`;
}

function renderLogin(){
  return `
  <div class="gate">
    <div class="gate-card">
      <img src="assets/logo.png" alt="Saifee Store logo" style="width:64px; height:64px; border-radius:50%; display:block; margin-bottom:14px;">
      <h1>Ops Ledger</h1>
      <p class="sub">${authMode==='signup' ? 'Create your login' : 'Sign in'}</p>
      ${authError ? `<div class="gate-error">${escapeHtml(authError)}</div>` : ''}
      <div class="form-grid single">
        ${authMode==='signup' ? `<div class="field"><label>Your name</label><input id="auth-name" placeholder="Full name" autocomplete="name"></div>` : ''}
        <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
        <div class="field"><label>Password</label><input id="auth-password" type="password" placeholder="••••••••" autocomplete="${authMode==='signup'?'new-password':'current-password'}"></div>
      </div>
      <button class="btn full" id="authSubmit" ${authBusy?'disabled':''}>${authBusy ? 'Please wait…' : (authMode==='signup' ? 'Create account' : 'Sign in')}</button>
      <div class="gate-note">
        ${authMode==='signup' ? 'Already have a login? ' : "New here? "}
        <span class="gate-link" id="authToggle">${authMode==='signup' ? 'Sign in' : 'Create one'}</span>
      </div>
    </div>
  </div>`;
}

function renderNoProfile(){
  return `
  <div class="gate">
    <div class="gate-card">
      <h1>Almost there</h1>
      <p class="sub">Setting up your account</p>
      <p style="font-size:13.5px; line-height:1.6; color:var(--ink-soft);">Your login worked, but no access has been set up for it yet. If you just signed up, this should resolve automatically — try refreshing in a moment. Otherwise, ask the owner to check your account.</p>
      <button class="btn ghost full" id="noProfileSignOut" style="margin-top:12px;">Sign out</button>
    </div>
  </div>`;
}

function attachNoProfileHandlers(){
  const btn = document.getElementById('noProfileSignOut');
  if(btn) btn.onclick = async ()=>{ await sb.auth.signOut(); session=null; profile=null; render(); };
}

function attachLoginHandlers(){
  const toggle = document.getElementById('authToggle');
  if(toggle) toggle.onclick = ()=>{ authMode = authMode==='signup'?'login':'signup'; authError=null; render(); };
  const submit = document.getElementById('authSubmit');
  if(submit) submit.onclick = async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const name = document.getElementById('auth-name') ? document.getElementById('auth-name').value.trim() : '';
    if(!email || !password){ authError='Enter an email and password.'; render(); return; }
    if(authMode==='signup' && !name){ authError='Enter your name.'; render(); return; }
    authBusy = true; authError = null; render();
    if(authMode==='signup'){
      const { data: res, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name } } });
      authBusy = false;
      if(error){ authError=error.message; render(); return; }
      if(!res.session){ authMode='login'; authError='Account created — check your email to confirm, then sign in.'; render(); return; }
      session = res.session;
      await afterLogin();
      return;
    }
    const { data: res, error } = await sb.auth.signInWithPassword({ email, password });
    authBusy = false;
    if(error){ authError=error.message; render(); return; }
    session = res.session;
    await afterLogin();
  };
}

function renderLedger(){
  const balance = data.ledger.reduce((s,e)=> s + (e.type==='credit'? Number(e.amount):-Number(e.amount)), 0);

  let filtered = [...data.ledger];
  if(ledgerPartyFilter){ filtered = filtered.filter(e => (e.partyType && (e.partyType+':'+e.partyId))===ledgerPartyFilter); }
  if(ledgerMonthFilter){ filtered = filtered.filter(e => e.date && e.date.slice(0,7)===ledgerMonthFilter); }
  const sorted = filtered.sort((a,b)=> b.date.localeCompare(a.date));
  const filtersActive = !!(ledgerPartyFilter || ledgerMonthFilter);

  const rows = sorted.length ? sorted.map(e=>{
    const party = e.partyType ? partyName(e.partyType, e.partyId) : null;
    return `
    <div class="row">
      <div class="row-main">
        <div class="row-title">${escapeHtml(e.description)}</div>
        <div class="row-meta">${fmtDate(e.date)}${party? ' · '+(e.partyType==='vendor'?'Vendor: ':'Customer: ')+escapeHtml(party):''}</div>
      </div>
      <span class="badge ${e.type}">${e.type}</span>
      <span class="amount ${e.type}">${e.type==='debit'?'-':'+'}${fmtMoney(e.amount)}</span>
      <button class="icon-btn del-ledger" data-id="${e.id}" title="Delete">✕</button>
    </div>
  `;
  }).join('') : `<div class="empty">${filtersActive ? 'No entries match this filter.' : 'No ledger entries yet — record your first transaction below.'}</div>`;

  const custOptions = data.customers.map(c=>`<option value="customer:${c.id}" ${ledgerPartyFilter==='customer:'+c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  const vendorOptions = data.vendors.map(v=>`<option value="vendor:${v.id}" ${ledgerPartyFilter==='vendor:'+v.id?'selected':''}>${escapeHtml(v.name)}</option>`).join('');

  const custFormOptions = data.customers.map(c=>`<option value="customer:${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const vendorFormOptions = data.vendors.map(v=>`<option value="vendor:${v.id}">${escapeHtml(v.name)}</option>`).join('');

  let filterSummary = '';
  if(filtersActive){
    const fCredit = sorted.filter(e=>e.type==='credit').reduce((s,e)=>s+Number(e.amount),0);
    const fDebit = sorted.filter(e=>e.type==='debit').reduce((s,e)=>s+Number(e.amount),0);
    const fNet = fCredit - fDebit;
    filterSummary = `
    <div class="stat-row" style="margin-bottom:18px;">
      <div class="stat"><div class="label">Entries</div><div class="value">${sorted.length}</div></div>
      <div class="stat credit"><div class="label">Credit</div><div class="value">${fmtMoney(fCredit)}</div></div>
      <div class="stat debit"><div class="label">Debit</div><div class="value">${fmtMoney(fDebit)}</div></div>
      <div class="stat ${fNet>=0?'credit':'debit'}"><div class="label">Net</div><div class="value">${fmtMoney(fNet)}</div></div>
    </div>`;
  }

  return `
    <div class="page-head">
      <div><h1>Ledger</h1><div class="sub">Private — running balance: <strong style="font-family:'IBM Plex Mono',monospace; color:${balance>=0?'var(--emerald)':'var(--rust)'};">${fmtMoney(balance)}</strong></div></div>

    </div>

    <div class="form-panel ${openForm==='ledger'?'open':''}" id="ledgerForm">
      <div class="form-grid">
        <div class="field full"><label>Description</label><input id="f-led-desc" placeholder="e.g. Invoice #204 payment"></div>
        <div class="field"><label>Date</label><input type="date" id="f-led-date" value="${todayISO()}"></div>
        <div class="field"><label>Type</label>
          <select id="f-led-type">
            <option value="credit">Credit (money in)</option>
            <option value="debit">Debit (money out)</option>
          </select>

        <div class="field"><label>Amount</label><input type="number" step="0.01" min="0" id="f-led-amount" placeholder="0.00"></div>
        <div class="field"><label>Customer or vendor (optional)</label>
          <select id="f-led-party">
            <option value="">—</option>
            ${custFormOptions ? `<optgroup label="Customers">${custFormOptions}</optgroup>` : ''}
            ${vendorFormOptions ? `<optgroup label="Vendors">${vendorFormOptions}</optgroup>` : ''}
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" id="saveLedger">Save entry</button>
        <button class="btn ghost" id="cancelLedger">Cancel</button>
      </div>
    </div>

    <div class="form-grid" style="grid-template-columns:1fr 1fr auto; align-items:end; margin-bottom:18px;">
      <div class="field">
        <label>Customer or vendor</label>
        <select id="f-ledger-filter-party">
          <option value="">All</option>
          ${custOptions ? `<optgroup label="Customers">${custOptions}</optgroup>` : ''}
          ${vendorOptions ? `<optgroup label="Vendors">${vendorOptions}</optgroup>` : ''}
        </select>
      </div>
      <div class="field">
        <label>Month</label>
        <input type="month" id="f-ledger-filter-month" value="${ledgerMonthFilter}">
      </div>
      <button class="btn ghost small" id="clearLedgerFilters" style="height:39px;">Clear</button>
    </div>

    ${filterSummary}

    <div class="sheet">${rows}</div>
  `;
}

// ---------- HANDLERS ----------
function attachNoteHandlers(){
  document.querySelectorAll('.add-note').forEach(btn=>{
    btn.onclick = ()=>{
      openForm='note';
      window._noteFor = { kind: btn.dataset.kind, id: btn.dataset.id };
      render();
      const panel = document.getElementById('noteForm');
      if(panel) panel.scrollIntoView({behavior:'smooth', block:'center'});
    };
  });
  document.querySelectorAll('.convo-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.kind+':'+btn.dataset.id;
      if(expandedLogs.has(key)) expandedLogs.delete(key); else expandedLogs.add(key);
      render();
    };
  });
  document.querySelectorAll('.del-note').forEach(btn=>{
    btn.onclick = async ()=>{
      const { error } = await sb.from('party_notes').delete().eq('id', btn.dataset.noteId);
      if(error){ alert(error.message); return; }
      await loadAll(); render();
    };
  });
  const cancelNote = document.getElementById('cancelNote');
  if(cancelNote) cancelNote.onclick = ()=>{ openForm=null; window._noteFor=null; render(); };
  const saveNote = document.getElementById('saveNote');
  if(saveNote) saveNote.onclick = async ()=>{
    const text = document.getElementById('f-note-text').value.trim();
    if(!text || !window._noteFor){ return; }
    const { error } = await sb.from('party_notes').insert({
      party_type: window._noteFor.kind,
      party_id: window._noteFor.id,
      date: document.getElementById('f-note-date').value || todayISO(),
      text,
      created_by: session.user.id
    });
    if(error){ alert(error.message); return; }
    openForm=null; window._noteFor=null; await loadAll(); render();
  };
}

function attachHandlers(){
  const signOut = document.getElementById('signOut');
  if(signOut) signOut.onclick = async ()=>{
    await sb.auth.signOut();
    session = null; profile = null;
    render();
  };

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{ view = el.dataset.view; openForm=null; render(); };
  });

  if(profile.role==='staff'){
    document.querySelectorAll('.filter-tab').forEach(btn=>{
      btn.onclick = ()=>{ taskFilter = btn.dataset.filter; render(); };
    });
    document.querySelectorAll('.task-check').forEach(btn=>{
      btn.onclick = async ()=>{
        const t = data.tasks.find(x=>x.id===btn.dataset.id);
        if(!t) return;
        const newStatus = t.status==='done' ? 'todo' : 'done';
        const completedAt = newStatus==='done' ? new Date().toISOString() : null;
        const { error } = await sb.from('tasks').update({ status:newStatus, completed_at:completedAt }).eq('id', t.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    return;
  }

  if(view==='dashboard'){
    const h1 = document.getElementById('companyNameEdit');
    if(h1){
      h1.onblur = async ()=>{
        const val = h1.textContent.trim() || 'My Company';
        data.company = val;
        await sb.from('settings').update({ company: val }).eq('id', true);
      };
      h1.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); h1.blur(); } };
    }
  }

  if(view==='tasks'){
    const toggle = document.getElementById('toggleTaskForm');
    if(toggle) toggle.onclick = ()=>{ openForm = openForm==='task'?null:'task'; render(); };
    const cancel = document.getElementById('cancelTask');
    if(cancel) cancel.onclick = ()=>{ openForm=null; render(); };
    const saveBtn = document.getElementById('saveTask');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const title = document.getElementById('f-task-title').value.trim();
      if(!title){ return; }
      const { error } = await sb.from('tasks').insert({
        title,
        assignee_id: document.getElementById('f-task-assignee').value || null,
        due: document.getElementById('f-task-due').value || null,
        priority: document.getElementById('f-task-priority').value,
        status: 'todo'
      });
      if(error){ alert(error.message); return; }
      openForm=null; await loadAll(); render();
    };
    document.querySelectorAll('.status-select').forEach(sel=>{
      sel.onchange = async ()=>{
        const { error } = await sb.from('tasks').update({ status: sel.value }).eq('id', sel.dataset.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    document.querySelectorAll('.task-check').forEach(btn=>{
      btn.onclick = async ()=>{
        const t = data.tasks.find(x=>x.id===btn.dataset.id);
        if(!t) return;
        const newStatus = t.status==='done' ? 'todo' : 'done';
        const completedAt = newStatus==='done' ? new Date().toISOString() : null;
        const { error } = await sb.from('tasks').update({ status:newStatus, completed_at:completedAt }).eq('id', t.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    document.querySelectorAll('.filter-tab').forEach(btn=>{
      btn.onclick = ()=>{ taskFilter = btn.dataset.filter; render(); };
    });
    document.querySelectorAll('.del-task').forEach(btn=>{
      btn.onclick = async ()=>{
        const { error } = await sb.from('tasks').delete().eq('id', btn.dataset.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
  }

  if(view==='team'){
    document.querySelectorAll('.del-staff').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm("Remove this person's access? Their login will remain but they will no longer be able to use the app.")) return;
        const { error } = await sb.from('profiles').delete().eq('id', btn.dataset.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
  }

  if(view==='customers'){
    const toggle = document.getElementById('toggleCustomerForm');
    if(toggle) toggle.onclick = ()=>{ openForm = openForm==='customer'?null:'customer'; render(); };
    const cancel = document.getElementById('cancelCustomer');
    if(cancel) cancel.onclick = ()=>{ openForm=null; render(); };
    const saveBtn = document.getElementById('saveCustomer');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const name = document.getElementById('f-cust-name').value.trim();
      if(!name){ return; }
      const { error } = await sb.from('customers').insert({
        name,
        phone: document.getElementById('f-cust-phone').value.trim(),
        email: document.getElementById('f-cust-email').value.trim()
      });
      if(error){ alert(error.message); return; }
      openForm=null; await loadAll(); render();
    };
    document.querySelectorAll('.del-customer').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        await sb.from('ledger').delete().eq('party_type','customer').eq('party_id', id);
        await sb.from('party_notes').delete().eq('party_type','customer').eq('party_id', id);
        const { error } = await sb.from('customers').delete().eq('id', id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    document.querySelectorAll('.add-appt').forEach(btn=>{
      btn.onclick = ()=>{
        openForm='appt';
        window._apptCustomerId = btn.dataset.id;
        render();
        const label = document.getElementById('apptForCustomer');
        if(label) label.textContent = customerName(window._apptCustomerId);
        document.getElementById('apptForm').scrollIntoView({behavior:'smooth', block:'center'});
      };
    });
    const cancelAppt = document.getElementById('cancelAppt');
    if(cancelAppt) cancelAppt.onclick = ()=>{ openForm=null; render(); };
    const saveAppt = document.getElementById('saveAppt');
    if(saveAppt) saveAppt.onclick = async ()=>{
      const dateVal = document.getElementById('f-appt-date').value;
      if(!dateVal || !window._apptCustomerId){ return; }
      const { error } = await sb.from('appointments').insert({
        customer_id: window._apptCustomerId,
        date: dateVal,
        time: document.getElementById('f-appt-time').value,
        service: document.getElementById('f-appt-service').value.trim(),
        notes: document.getElementById('f-appt-notes').value.trim()
      });
      if(error){ alert(error.message); return; }
      openForm=null; await loadAll(); render();
    };
    if(openForm==='appt' && window._apptCustomerId){
      const label = document.getElementById('apptForCustomer');
      if(label) label.textContent = customerName(window._apptCustomerId);
    }
    attachNoteHandlers();
  }

  if(view==='vendors'){
    const toggle = document.getElementById('toggleVendorForm');
    if(toggle) toggle.onclick = ()=>{ openForm = openForm==='vendor'?null:'vendor'; render(); };
    const cancel = document.getElementById('cancelVendor');
    if(cancel) cancel.onclick = ()=>{ openForm=null; render(); };
    const saveBtn = document.getElementById('saveVendor');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const name = document.getElementById('f-vendor-name').value.trim();
      if(!name){ return; }
      const { error } = await sb.from('vendors').insert({
        name,
        phone: document.getElementById('f-vendor-phone').value.trim(),
        email: document.getElementById('f-vendor-email').value.trim()
      });
      if(error){ alert(error.message); return; }
      openForm=null; await loadAll(); render();
    };
    document.querySelectorAll('.del-vendor').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        await sb.from('ledger').delete().eq('party_type','vendor').eq('party_id', id);
        await sb.from('party_notes').delete().eq('party_type','vendor').eq('party_id', id);
        const { error } = await sb.from('vendors').delete().eq('id', id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    attachNoteHandlers();
  }

  if(view==='ledger'){
    const toggle = document.getElementById('toggleLedgerForm');
    if(toggle) toggle.onclick = ()=>{ openForm = openForm==='ledger'?null:'ledger'; render(); };
    const cancel = document.getElementById('cancelLedger');
    if(cancel) cancel.onclick = ()=>{ openForm=null; render(); };
    const saveBtn = document.getElementById('saveLedger');
    if(saveBtn) saveBtn.onclick = async ()=>{
      const desc = document.getElementById('f-led-desc').value.trim();
      const amount = parseFloat(document.getElementById('f-led-amount').value);
      if(!desc || isNaN(amount) || amount<0){ return; }
      const partyVal = document.getElementById('f-led-party').value;
      let partyType=null, partyId=null;
      if(partyVal){ [partyType, partyId] = partyVal.split(':'); }
      const { error } = await sb.from('ledger').insert({
        description: desc,
        date: document.getElementById('f-led-date').value || todayISO(),
        type: document.getElementById('f-led-type').value,
        amount,
        party_type: partyType,
        party_id: partyId
      });
      if(error){ alert(error.message); return; }
      openForm=null; await loadAll(); render();
    };
    document.querySelectorAll('.del-ledger').forEach(btn=>{
      btn.onclick = async ()=>{
        const { error } = await sb.from('ledger').delete().eq('id', btn.dataset.id);
        if(error){ alert(error.message); return; }
        await loadAll(); render();
      };
    });
    const filterParty = document.getElementById('f-ledger-filter-party');
    if(filterParty) filterParty.onchange = ()=>{ ledgerPartyFilter = filterParty.value; render(); };
    const filterMonth = document.getElementById('f-ledger-filter-month');
    if(filterMonth) filterMonth.onchange = ()=>{ ledgerMonthFilter = filterMonth.value; render(); };
    const clearFilters = document.getElementById('clearLedgerFilters');
    if(clearFilters) clearFilters.onclick = ()=>{ ledgerPartyFilter=''; ledgerMonthFilter=''; render(); };
  }
}

boot();
</script>
</body>
</html>
